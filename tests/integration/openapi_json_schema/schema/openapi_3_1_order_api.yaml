openapi: 3.1.0
info:
  title: Orders API
  version: "1.0.0"
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [orderId, customer, items]
      properties:
        orderId:
          type: string
          minLength: 1
        customer:
          type: object
          required: [email]
          properties:
            email:
              type: string
              format: email
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              sku:
                type: string
                pattern: "^[A-Z0-9-]+$"
              qty:
                type: integer
                minimum: 1
    CreateOrderResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [accepted, rejected]
        data:
          type: object
          required: [orderId, lines]
          properties:
            orderId:
              type: string
            lines:
              type: array
              items:
                type: object
                required: [totalAmount]
                properties:
                  totalAmount:
                    type: string

